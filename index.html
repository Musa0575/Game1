<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>⏱️ Escape Room: Lab Informatika</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      background: linear-gradient(160deg, #061520 0%, #0d2538 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      margin: 0;
      touch-action: manipulation;
    }

    .game-container {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 38px;
      padding: 18px 14px 22px;
      box-shadow: 0 30px 55px rgba(0, 0, 0, 0.75), inset 0 0 20px rgba(0, 200, 255, 0.2);
      border: 1px solid rgba(0, 210, 255, 0.3);
      color: #e4f4ff;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ========== SCREEN: REGISTRASI ========== */
    .registration-screen {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 10px 6px;
    }

    .reg-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #00ccff;
      text-shadow: 0 0 15px #00a6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .reg-subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #a0c8e0;
      margin-top: -10px;
    }

    .reg-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #0a1e30cc;
      border-radius: 24px;
      padding: 18px;
      border: 1px solid #2c5877;
    }

    .reg-form label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #b3dffc;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reg-form input {
      background: #10273b;
      border: 2px solid #2c5a7a;
      border-radius: 30px;
      padding: 14px 18px;
      font-size: 1rem;
      color: white;
      outline: none;
      caret-color: #00ccff;
      width: 100%;
    }

    .reg-form input:focus {
      border-color: #00b7ff;
      box-shadow: 0 0 12px #0077ff;
    }

    .reg-form input::placeholder {
      color: #5a8099;
    }

    .start-btn {
      background: linear-gradient(135deg, #00aa44, #006633);
      border: none;
      color: white;
      font-weight: bold;
      padding: 16px;
      border-radius: 40px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #00331a, 0 10px 20px black;
      border: 2px solid #00cc66;
      letter-spacing: 1px;
      transition: 0.1s linear;
      touch-action: manipulation;
    }

    .start-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #00331a, 0 6px 14px black;
    }

    .start-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .error-reg {
      color: #ff8888;
      font-size: 0.8rem;
      text-align: center;
      min-height: 18px;
    }

    /* ========== SCREEN: GAME ========== */
    .game-screen {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(5, 18, 32, 0.8);
      border-radius: 50px;
      padding: 12px 20px;
      border: 1px solid #00a6ff55;
      flex-wrap: wrap;
      gap: 8px;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #9ac7e7;
    }

    .player-name-display {
      font-weight: 700;
      color: #ffd966;
    }

    .status-badge {
      background: #00c8ff;
      color: #001a26;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      text-transform: uppercase;
    }

    .timer-box {
      background: #0a1e30;
      border-radius: 30px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px solid #ffaa00;
      font-weight: bold;
      font-size: 1.5rem;
      color: #ffcc66;
    }

    .timer-warning {
      border-color: #ff4444 !important;
      color: #ff7777 !important;
      animation: pulse 0.7s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to { opacity: 0.5; }
    }

    .door-visual {
      background: #1a2f42;
      border-radius: 24px;
      padding: 5px;
      border: 2px solid #3d627c;
    }

    .door {
      background: radial-gradient(circle at 25% 25%, #4e7a9e, #0a1826);
      border-radius: 20px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      filter: drop-shadow(0 8px 14px black);
      transition: 0.3s;
      border: 2px solid #6e9fc0;
    }

    .locked-door {
      filter: drop-shadow(0 0 12px #ff444488);
    }

    .unlocked-door {
      filter: drop-shadow(0 0 25px #00ff99);
      border-color: #00ffaa;
    }

    .puzzle-panel {
      background: #081929dd;
      border-radius: 28px;
      padding: 14px 12px;
      border: 1px solid #2c5877;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .puzzle-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #9ac7e7;
    }

    .puzzle-question {
      font-size: 0.95rem;
      font-weight: 600;
      background: #0b1f32;
      padding: 12px;
      border-radius: 20px;
      color: #ceecff;
      border-left: 5px solid #00b7ff;
      line-height: 1.5;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="text"] {
      background: #0f253b;
      border: 2px solid #2c5a7a;
      border-radius: 30px;
      padding: 14px 18px;
      font-size: 1rem;
      color: white;
      outline: none;
      caret-color: #00ccff;
    }

    input[type="text"]:focus {
      border-color: #00b7ff;
      box-shadow: 0 0 12px #0077ff;
    }

    input:disabled {
      opacity: 0.6;
      background: #1a2e40;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: linear-gradient(135deg, #006994, #003d5e);
      border: none;
      color: white;
      font-weight: bold;
      padding: 13px 14px;
      border-radius: 40px;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 5px 0 #00141f, 0 8px 16px black;
      transition: 0.1s linear;
      border: 1px solid #00a3cc;
      flex: 1;
      min-width: 70px;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #00141f, 0 5px 10px black;
    }

    button:disabled {
      opacity: 0.5;
      transform: none;
      box-shadow: 0 3px 0 #00141f;
      pointer-events: none;
    }

    .hint-text {
      font-size: 0.75rem;
      color: #b8dff5;
      font-style: italic;
      background: #0a1f3055;
      padding: 6px 10px;
      border-radius: 14px;
    }

    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      background: #0c2338;
      border-radius: 30px;
      padding: 8px 14px;
      flex-wrap: wrap;
    }

    .key-icons {
      display: flex;
      gap: 2px;
      font-size: 0.85rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .message {
      font-weight: 600;
      text-align: center;
      min-height: 20px;
      color: #ffd966;
      font-size: 0.85rem;
    }

    .reset-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .small-btn {
      background: #1b3349;
      border: 1px solid #4f7b99;
      padding: 10px 18px;
      font-size: 0.75rem;
      box-shadow: none;
    }

    .logout-btn {
      background: #4a2020;
      border: 1px solid #996666;
      padding: 10px 18px;
      font-size: 0.75rem;
      box-shadow: none;
      color: #ffcccc;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    .nav-btn {
      background: #1b3b52;
      padding: 8px 14px;
      font-size: 0.75rem;
      box-shadow: 0 3px 0 #00141f;
      min-width: 50px;
    }
  </style>
</head>
<body>
  <div class="game-container" id="gameContainer">
    <!-- ==================== SCREEN REGISTRASI ==================== -->
    <div class="registration-screen" id="registrationScreen">
      <div class="reg-title">
        <span>🔐</span> Escape Room
        <span>💻</span>
      </div>
      <div class="reg-subtitle">Lab Informatika • 15 Teka-Teki • 25 Detik/Soal</div>
      
      <div class="reg-form">
        <label for="playerName">👤 Nama Lengkap</label>
        <input type="text" id="playerName" placeholder="Masukkan nama kamu..." autocomplete="off" enterkeyhint="next">
        
        <label for="playerClass">🏫 Kelas</label>
        <input type="text" id="playerClass" placeholder="Contoh: X RPL 1 / X TKJ 2" autocomplete="off" enterkeyhint="done">
        
        <div class="error-reg" id="errorReg"></div>
        
        <button class="start-btn" id="startGameBtn">
          🚀 MULAI ESCAPE ROOM
        </button>
      </div>
      
      <div style="text-align: center; font-size: 0.7rem; color: #668899;">
        ⏱️ 25 detik per soal • ❌ Gagal jika waktu habis • 🔄 Bisa diulang
      </div>
    </div>

    <!-- ==================== SCREEN GAME ==================== -->
    <div class="game-screen" id="gameScreen">
      <div class="room-header">
        <div class="player-info">
          <span>👤</span>
          <span class="player-name-display" id="playerNameDisplay">-</span>
          <span>|</span>
          <span>🏫</span>
          <span id="playerClassDisplay">-</span>
        </div>
        <span class="status-badge" id="statusText">TERKUNCI</span>
      </div>

      <!-- Timer -->
      <div class="timer-box" id="timerBox">
        <span>⏱️</span>
        <span id="timerDisplay">25</span>
        <span>detik</span>
      </div>

      <div class="door-visual">
        <div class="door locked-door" id="doorElement">🚪🔒</div>
      </div>

      <div class="progress">
        <span>🔑 Progress</span>
        <span class="key-icons" id="keyIcons"></span>
        <span id="counterLabel">0/15</span>
      </div>

      <div class="puzzle-panel" id="puzzlePanel">
        <div class="puzzle-header">
          <span id="puzzleSubject">Algoritma</span>
          <span id="puzzleNumber">Soal 1/15</span>
        </div>
        <div class="puzzle-question" id="questionDisplay">🧩 Teka-teki muncul di sini</div>
        <div class="input-area">
          <input type="text" id="answerInput" placeholder="Ketik jawaban..." autocomplete="off" enterkeyhint="done">
          <div class="btn-group">
            <button id="submitBtn">🔍 Jawab</button>
            <button id="hintBtn">💡 Hint</button>
          </div>
        </div>
        <div class="hint-text" id="hintDisplay"></div>
        <div class="message" id="messageDisplay"></div>
        <div class="pagination">
          <button class="nav-btn" id="prevBtn">◀ Sebelumnya</button>
          <span id="pageIndicator">1/15</span>
          <button class="nav-btn" id="nextBtn">Berikutnya ▶</button>
        </div>
      </div>

      <div class="reset-area">
        <button class="logout-btn" id="logoutBtn">🚪 Ganti Peserta</button>
        <button class="small-btn" id="resetButton">🔄 Ulangi Game</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ========== DATA TEKA-TEKI ==========
      const puzzles = [
        { id: 0, subject: "Algoritma", question: "➰ Dalam pseudocode: x = 10, jika x > 5 maka x = x * 2, selain itu x = x - 3. Berapa x akhir?", answer: "20", hints: ["10 > 5 benar, jadi 10 × 2", "Jawaban angka"] },
        { id: 1, subject: "Bilangan Biner", question: "🔢 Konversi biner 1101 ke desimal.", answer: "13", hints: ["8+4+0+1", "Hasil antara 12-14"] },
        { id: 2, subject: "Logika", question: "🧠 Gerbang OR: A=0, B=1, output? (0/1)", answer: "1", hints: ["OR = 1 jika ada input 1", "Karena B=1, output 1"] },
        { id: 3, subject: "Hardware", question: "🖥️ Kepanjangan RAM? (Bahasa Inggris)", answer: "random access memory", alternativeAnswers: ["random access memory", "ram"], hints: ["Random Access Memory", "3 kata"] },
        { id: 4, subject: "Jaringan", question: "🌐 Singkatan dari LAN?", answer: "local area network", alternativeAnswers: ["local area network", "lan"], hints: ["Local Area Network", "Jaringan area lokal"] },
        { id: 5, subject: "Pemrograman", question: "💻 Perintah Python untuk menampilkan teks?", answer: "print", hints: ["Dimulai dengan p", "5 huruf"] },
        { id: 6, subject: "Algoritma", question: "🔄 Struktur perulangan selama kondisi benar? (while/for/if)", answer: "while", hints: ["Dimulai dengan w", "5 huruf"] },
        { id: 7, subject: "Bilangan Biner", question: "🔢 Desimal 255 dalam biner 8 bit?", answer: "11111111", hints: ["Semua bit 1", "8 kali angka 1"] },
        { id: 8, subject: "Keamanan Data", question: "🔐 Proses mengubah data jadi kode rahasia?", answer: "enkripsi", alternativeAnswers: ["encryption", "enkripsi"], hints: ["Dimulai E", "Lawannya dekripsi"] },
        { id: 9, subject: "Sistem Operasi", question: "🪟 OS Microsoft paling populer?", answer: "windows", hints: ["Dimulai W", "Bukan Linux/macOS"] },
        { id: 10, subject: "Algoritma", question: "🔢 Algoritma pengurutan tukar elemen bersebelahan? (bubble/quick/merge)", answer: "bubble", hints: ["Gelembung", "Bubble sort"] },
        { id: 11, subject: "Basis Data", question: "🗃️ Singkatan DBMS?", answer: "database management system", alternativeAnswers: ["database management system", "dbms"], hints: ["Database Management System", "4 kata"] },
        { id: 12, subject: "Pemrograman Web", question: "🌍 Bahasa markup halaman web?", answer: "html", alternativeAnswers: ["html", "hypertext markup language"], hints: ["H...", "HyperText Markup Language"] },
        { id: 13, subject: "Logika", question: "🧮 Gerbang NOT: input 0, output? (0/1)", answer: "1", hints: ["NOT membalik", "0 jadi 1"] },
        { id: 14, subject: "Informatika Umum", question: "📱 Penyimpanan permanen di komputer? (HDD/SSD)", answer: "hardisk", alternativeAnswers: ["hardisk", "harddisk", "hard drive", "ssd", "hdd"], hints: ["H... atau S...", "Penyimpanan sekunder"] }
      ];

      const TOTAL_PUZZLES = puzzles.length;
      const TIME_LIMIT = 25;

      // ========== STATE ==========
      let playerName = '';
      let playerClass = '';
      let solvedStatus = new Array(TOTAL_PUZZLES).fill(false);
      let failedStatus = new Array(TOTAL_PUZZLES).fill(false);
      let currentPuzzleIndex = 0;
      let timeLeft = TIME_LIMIT;
      let timerInterval = null;
      let messageTimeout = null;

      // ========== DOM ELEMENTS ==========
      // Registrasi
      const registrationScreen = document.getElementById('registrationScreen');
      const gameScreen = document.getElementById('gameScreen');
      const playerNameInput = document.getElementById('playerName');
      const playerClassInput = document.getElementById('playerClass');
      const errorReg = document.getElementById('errorReg');
      const startGameBtn = document.getElementById('startGameBtn');

      // Game
      const playerNameDisplay = document.getElementById('playerNameDisplay');
      const playerClassDisplay = document.getElementById('playerClassDisplay');
      const doorEl = document.getElementById('doorElement');
      const statusText = document.getElementById('statusText');
      const timerBox = document.getElementById('timerBox');
      const timerDisplay = document.getElementById('timerDisplay');
      const keyIconsEl = document.getElementById('keyIcons');
      const counterLabel = document.getElementById('counterLabel');
      const puzzleSubject = document.getElementById('puzzleSubject');
      const puzzleNumber = document.getElementById('puzzleNumber');
      const questionDisplay = document.getElementById('questionDisplay');
      const answerInput = document.getElementById('answerInput');
      const submitBtn = document.getElementById('submitBtn');
      const hintBtn = document.getElementById('hintBtn');
      const hintDisplay = document.getElementById('hintDisplay');
      const messageDisplay = document.getElementById('messageDisplay');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const pageIndicator = document.getElementById('pageIndicator');
      const resetBtn = document.getElementById('resetButton');
      const logoutBtn = document.getElementById('logoutBtn');

      // ========== REGISTRASI ==========
      function validateRegistration() {
        const name = playerNameInput.value.trim();
        const kelas = playerClassInput.value.trim();
        
        if (name === '' && kelas === '') {
          errorReg.textContent = '⚠️ Nama dan kelas harus diisi!';
          return false;
        }
        if (name === '') {
          errorReg.textContent = '⚠️ Nama lengkap harus diisi!';
          playerNameInput.focus();
          return false;
        }
        if (kelas === '') {
          errorReg.textContent = '⚠️ Kelas harus diisi!';
          playerClassInput.focus();
          return false;
        }
        if (name.length < 3) {
          errorReg.textContent = '⚠️ Nama minimal 3 karakter!';
          playerNameInput.focus();
          return false;
        }
        errorReg.textContent = '';
        return true;
      }

      function startGame() {
        if (!validateRegistration()) return;

        playerName = playerNameInput.value.trim();
        playerClass = playerClassInput.value.trim();

        // Update display
        playerNameDisplay.textContent = playerName;
        playerClassDisplay.textContent = playerClass;

        // Reset game state
        solvedStatus = new Array(TOTAL_PUZZLES).fill(false);
        failedStatus = new Array(TOTAL_PUZZLES).fill(false);
        currentPuzzleIndex = 0;
        if (messageTimeout) clearTimeout(messageTimeout);
        messageDisplay.textContent = '';
        hintDisplay.textContent = '';
        timerBox.classList.remove('timer-warning');

        // Switch screen
        registrationScreen.style.display = 'none';
        gameScreen.style.display = 'flex';

        // Init game
        updateUI();
        answerInput.focus();
        showMessage(`Selamat datang, ${playerName}! Selesaikan 15 teka-teki!`, true);
      }

      function logoutToRegistration() {
        stopTimer();
        if (messageTimeout) clearTimeout(messageTimeout);
        
        // Clear game state
        solvedStatus = new Array(TOTAL_PUZZLES).fill(false);
        failedStatus = new Array(TOTAL_PUZZLES).fill(false);
        currentPuzzleIndex = 0;
        playerName = '';
        playerClass = '';
        
        // Clear inputs
        answerInput.value = '';
        messageDisplay.textContent = '';
        hintDisplay.textContent = '';
        timerBox.classList.remove('timer-warning');
        timerDisplay.textContent = TIME_LIMIT;

        // Switch screen
        gameScreen.style.display = 'none';
        registrationScreen.style.display = 'flex';
        
        // Clear reg form
        playerNameInput.value = '';
        playerClassInput.value = '';
        errorReg.textContent = '';
        playerNameInput.focus();
      }

      // ========== TIMER ==========
      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function startTimer() {
        stopTimer();
        if (solvedStatus[currentPuzzleIndex] || failedStatus[currentPuzzleIndex]) {
          timerDisplay.textContent = '--';
          timerBox.classList.remove('timer-warning');
          return;
        }
        if (solvedStatus.every(v => v)) {
          timerDisplay.textContent = '✓';
          timerBox.classList.remove('timer-warning');
          return;
        }

        timeLeft = TIME_LIMIT;
        timerDisplay.textContent = timeLeft;
        timerBox.classList.remove('timer-warning');

        timerInterval = setInterval(() => {
          timeLeft--;
          timerDisplay.textContent = timeLeft;

          if (timeLeft <= 5) {
            timerBox.classList.add('timer-warning');
          } else {
            timerBox.classList.remove('timer-warning');
          }

          if (timeLeft <= 0) {
            stopTimer();
            timerBox.classList.remove('timer-warning');
            handleTimeout();
          }
        }, 1000);
      }

      function handleTimeout() {
        if (solvedStatus[currentPuzzleIndex] || failedStatus[currentPuzzleIndex]) return;
        if (solvedStatus.every(v => v)) return;

        failedStatus[currentPuzzleIndex] = true;
        showMessage('⏰ Waktu habis! Soal ini gagal. Coba soal lain.', false);
        updateUI();
        checkGameOver();
      }

      function checkGameOver() {
        const allDone = solvedStatus.every((v, i) => v || failedStatus[i]);
        if (allDone && !solvedStatus.every(v => v)) {
          showMessage('😞 Beberapa soal gagal. Pintu tetap terkunci. Ulangi game untuk coba lagi.', false);
          stopTimer();
          timerDisplay.textContent = '✗';
        }
      }

      // ========== UI ==========
      function updateUI() {
        const solvedCount = solvedStatus.filter(v => v).length;
        const failedCount = failedStatus.filter(v => v).length;

        // Ikon progress
        let icons = '';
        for (let i = 0; i < TOTAL_PUZZLES; i++) {
          if (solvedStatus[i]) icons += '🔑';
          else if (failedStatus[i]) icons += '❌';
          else icons += '⚪';
        }
        keyIconsEl.textContent = icons;
        counterLabel.textContent = `${solvedCount}/${TOTAL_PUZZLES} benar`;

        // Pintu
        if (solvedCount === TOTAL_PUZZLES) {
          doorEl.classList.remove('locked-door');
          doorEl.classList.add('unlocked-door');
          doorEl.textContent = '🚪✨';
          statusText.textContent = 'TERBUKA';
          statusText.style.background = '#00c853';
          stopTimer();
          timerDisplay.textContent = '✓';
        } else {
          doorEl.classList.add('locked-door');
          doorEl.classList.remove('unlocked-door');
          doorEl.textContent = '🚪🔒';
          statusText.textContent = 'TERKUNCI';
          statusText.style.background = '#00c8ff';
        }

        // Puzzle display
        const puzzle = puzzles[currentPuzzleIndex];
        puzzleSubject.textContent = puzzle.subject;
        puzzleNumber.textContent = `Soal ${currentPuzzleIndex+1}/${TOTAL_PUZZLES}`;
        questionDisplay.textContent = puzzle.question;
        pageIndicator.textContent = `${currentPuzzleIndex+1}/${TOTAL_PUZZLES}`;

        const isSolved = solvedStatus[currentPuzzleIndex];
        const isFailed = failedStatus[currentPuzzleIndex];
        const allSolved = solvedStatus.every(v => v);

        if (allSolved) {
          answerInput.disabled = true;
          submitBtn.disabled = true;
          hintBtn.disabled = true;
          answerInput.value = '';
          answerInput.placeholder = 'Semua terjawab!';
          hintDisplay.textContent = '🎉 Pintu terbuka! Selamat!';
        } else if (isSolved) {
          answerInput.disabled = true;
          submitBtn.disabled = true;
          hintBtn.disabled = false;
          answerInput.value = puzzle.answer;
          hintDisplay.textContent = '✅ Soal ini sudah benar.';
        } else if (isFailed) {
          answerInput.disabled = true;
          submitBtn.disabled = true;
          hintBtn.disabled = true;
          answerInput.value = '';
          answerInput.placeholder = 'Waktu habis – soal gagal';
          hintDisplay.textContent = '❌ Soal ini gagal (waktu habis).';
        } else {
          answerInput.disabled = false;
          submitBtn.disabled = false;
          hintBtn.disabled = false;
          answerInput.value = '';
          answerInput.placeholder = 'Ketik jawaban...';
          hintDisplay.textContent = '';
        }

        // Timer control
        if (!allSolved && !isSolved && !isFailed) {
          startTimer();
        } else if (allSolved || isSolved || isFailed) {
          stopTimer();
          if (allSolved) timerDisplay.textContent = '✓';
          else if (isFailed) timerDisplay.textContent = '✗';
          else timerDisplay.textContent = '--';
          timerBox.classList.remove('timer-warning');
        }

        checkGameOver();
      }

      function checkAnswer(userAnswer, puzzle) {
        const norm = userAnswer.trim().toLowerCase();
        if (norm === '') return false;
        if (norm === puzzle.answer.toLowerCase()) return true;
        if (puzzle.alternativeAnswers) {
          return puzzle.alternativeAnswers.some(a => norm === a.toLowerCase());
        }
        return false;
      }

      function showMessage(text, good = true) {
        if (messageTimeout) clearTimeout(messageTimeout);
        messageDisplay.textContent = text;
        messageDisplay.style.color = good ? '#b9f5b0' : '#ffaaaa';
        messageTimeout = setTimeout(() => { messageDisplay.textContent = ''; }, 3000);
      }

      function handleSubmit() {
        if (solvedStatus.every(v => v)) {
          showMessage('Pintu sudah terbuka! 🎉', true);
          return;
        }
        if (solvedStatus[currentPuzzleIndex] || failedStatus[currentPuzzleIndex]) {
          showMessage('Soal ini tidak bisa dijawab lagi.', false);
          return;
        }

        const puzzle = puzzles[currentPuzzleIndex];
        const ans = answerInput.value.trim();
        if (ans === '') {
          showMessage('⚠️ Masukkan jawaban dulu.', false);
          return;
        }

        if (checkAnswer(ans, puzzle)) {
          stopTimer();
          solvedStatus[currentPuzzleIndex] = true;
          showMessage('✅ Benar! Kunci bertambah.', true);
          updateUI();
          if (solvedStatus.every(v => v)) {
            showMessage(`🎉 SELAMAT ${playerName}! Semua teka-teki terpecahkan! Pintu terbuka!`, true);
          }
        } else {
          showMessage('❌ Jawaban salah. Coba lagi.', false);
          answerInput.value = '';
          answerInput.focus();
        }
      }

      function showHint() {
        if (solvedStatus.every(v => v)) {
          hintDisplay.textContent = '🎯 Semua selesai!';
          return;
        }
        if (failedStatus[currentPuzzleIndex]) {
          hintDisplay.textContent = '❌ Soal sudah gagal.';
          return;
        }
        const puzzle = puzzles[currentPuzzleIndex];
        if (puzzle.hints && puzzle.hints.length > 0) {
          hintDisplay.textContent = `💬 Hint: ${puzzle.hints[Math.floor(Math.random() * puzzle.hints.length)]}`;
        } else {
          hintDisplay.textContent = 'ℹ️ Tidak ada hint.';
        }
      }

      function goToPuzzle(index) {
        if (index < 0 || index >= TOTAL_PUZZLES) return;
        stopTimer();
        currentPuzzleIndex = index;
        updateUI();
        if (!solvedStatus[currentPuzzleIndex] && !failedStatus[currentPuzzleIndex] && !solvedStatus.every(v=>v)) {
          answerInput.focus();
        }
      }

      function resetGame() {
        stopTimer();
        solvedStatus = new Array(TOTAL_PUZZLES).fill(false);
        failedStatus = new Array(TOTAL_PUZZLES).fill(false);
        currentPuzzleIndex = 0;
        if (messageTimeout) clearTimeout(messageTimeout);
        messageDisplay.textContent = '';
        hintDisplay.textContent = '';
        timerBox.classList.remove('timer-warning');
        updateUI();
        answerInput.focus();
        showMessage(`🔄 Game di-reset. Semangat ${playerName}! 15 soal, 25 detik/soal.`, true);
      }

      // ========== EVENT LISTENERS ==========
      // Registrasi
      startGameBtn.addEventListener('click', startGame);
      
      playerNameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          playerClassInput.focus();
        }
      });
      
      playerClassInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          startGame();
        }
      });

      // Validasi real-time
      playerNameInput.addEventListener('input', () => {
        if (playerNameInput.value.trim().length >= 3) {
          errorReg.textContent = '';
        }
      });
      
      playerClassInput.addEventListener('input', () => {
        if (playerClassInput.value.trim() !== '') {
          errorReg.textContent = '';
        }
      });

      // Game
      submitBtn.addEventListener('click', handleSubmit);
      hintBtn.addEventListener('click', showHint);
      resetBtn.addEventListener('click', resetGame);
      logoutBtn.addEventListener('click', logoutToRegistration);
      prevBtn.addEventListener('click', () => goToPuzzle(currentPuzzleIndex - 1));
      nextBtn.addEventListener('click', () => goToPuzzle(currentPuzzleIndex + 1));
      
      answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSubmit();
        }
      });

      // ========== INIT ==========
      // Tampilkan layar registrasi pertama kali
      registrationScreen.style.display = 'flex';
      gameScreen.style.display = 'none';
      playerNameInput.focus();
      
      document.addEventListener('touchstart', function(){}, {passive: true});
    })();
  </script>
</body>
</html>
