<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>🏆 Escape Room: Lab Informatika</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --cyan: #00e5ff;
      --green: #00ff88;
      --red: #ff4757;
      --gold: #ffd700;
      --purple: #a855f7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .game-wrapper {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 16px 10px 18px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      color: #e4f4ff;
      min-height: 500px;
    }

    /* ========== REGISTRATION ========== */
    #regScreen {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 20px 8px;
    }
    .reg-icon { text-align: center; font-size: 3.5rem; }
    .reg-title {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .reg-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(10,25,45,0.8);
      border-radius: 20px;
      padding: 18px 14px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .reg-form label {
      font-weight: 600;
      font-size: 0.85rem;
      color: #b3dffc;
    }
    .reg-form input {
      background: #10273b;
      border: 2px solid #2c5a7a;
      border-radius: 28px;
      padding: 14px 16px;
      font-size: 1rem;
      color: white;
      outline: none;
      width: 100%;
      transition: 0.3s;
    }
    .reg-form input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0,229,255,0.2);
    }
    .error-msg {
      color: var(--red);
      font-size: 0.8rem;
      text-align: center;
      min-height: 20px;
    }
    .btn {
      border: none;
      color: white;
      font-weight: bold;
      padding: 14px;
      border-radius: 30px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      text-align: center;
    }
    .btn:active { transform: scale(0.95); }
    .btn-green {
      background: linear-gradient(135deg, #00aa44, #006633);
      border: 2px solid #00cc66;
      box-shadow: 0 4px 0 #00331a;
      font-size: 1rem;
    }
    .btn-blue {
      background: linear-gradient(135deg, #006994, #003d5e);
      border: 1px solid #00a3cc;
      box-shadow: 0 3px 0 #00141f;
    }
    .btn-red {
      background: linear-gradient(135deg, #884444, #553333);
      border: 1px solid #996666;
      box-shadow: 0 3px 0 #331111;
    }
    .btn:disabled { opacity: 0.4; pointer-events: none; }

    /* ========== LEVEL SELECT ========== */
    #levelScreen {
      display: none;
      flex-direction: column;
      gap: 14px;
      padding: 8px 4px;
    }
    .story-box {
      background: rgba(15,25,40,0.9);
      border-radius: 16px;
      padding: 14px;
      font-size: 0.85rem;
      color: #ccddee;
      border-left: 4px solid var(--gold);
      font-style: italic;
      line-height: 1.5;
    }
    .level-card {
      background: rgba(10,30,48,0.85);
      border-radius: 18px;
      padding: 14px;
      border: 2px solid rgba(44,88,119,0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 8px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .level-card:active { transform: scale(0.96); background: #0d2840; }
    .level-card.locked {
      opacity: 0.4;
      pointer-events: none;
      border-color: #554433;
    }
    .level-card.unlocked {
      border-color: var(--green);
      box-shadow: 0 0 15px rgba(0,255,136,0.15);
    }
    .level-card.completed {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(255,215,0,0.2);
    }
    .level-info { display: flex; flex-direction: column; gap: 2px; }
    .level-name { font-weight: 700; font-size: 1rem; }
    .level-desc { font-size: 0.7rem; color: #99bbcc; }
    .level-icon { font-size: 2.5rem; min-width: 45px; text-align: center; }
    .rank-box {
      background: rgba(26,51,68,0.8);
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 0.85rem;
      text-align: center;
      border: 1px solid rgba(255,215,0,0.2);
    }

    /* ========== GAME ========== */
    #gameScreen {
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5,18,32,0.9);
      border-radius: 30px;
      padding: 8px 14px;
      border: 1px solid rgba(0,166,255,0.3);
      flex-wrap: wrap;
      gap: 4px;
    }
    .player-tag {
      font-size: 0.7rem;
      color: #9ac7e7;
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }
    .level-tag {
      background: var(--gold);
      color: #000;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 16px;
      font-size: 0.65rem;
    }
    .status-tag {
      background: var(--cyan);
      color: #001a26;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.65rem;
      text-transform: uppercase;
    }
    .timer-row {
      background: rgba(10,30,48,0.9);
      border-radius: 24px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 2px solid var(--gold);
      font-weight: bold;
      font-size: 1.3rem;
      color: #ffcc66;
    }
    .timer-warning { border-color: var(--red) !important; color: #ff7777 !important; animation: pulse 0.5s infinite alternate; }
    @keyframes pulse { from{transform:scale(1)} to{transform:scale(1.05)} }
    .timer-bar {
      width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;
    }
    .timer-bar-fill {
      height: 100%; background: linear-gradient(90deg, var(--green), var(--gold), var(--red));
      transition: width 1s linear; border-radius: 2px;
    }
    .door-box {
      background: rgba(26,47,66,0.8); border-radius: 18px; padding: 4px; border: 2px solid rgba(61,98,124,0.5);
    }
    .door {
      background: radial-gradient(circle at 25% 25%, #4e7a9e, #0a1826);
      border-radius: 16px; height: 55px; display: flex; align-items: center; justify-content: center;
      font-size: 2.3rem; transition: 0.4s; border: 2px solid #6e9fc0;
    }
    .door.locked { filter: drop-shadow(0 0 10px rgba(255,68,68,0.4)); }
    .door.unlocked { filter: drop-shadow(0 0 25px var(--green)); border-color: var(--green); }
    .progress-row {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(12,35,56,0.8); border-radius: 22px; padding: 6px 12px; font-size: 0.75rem;
    }
    .key-icons { display: flex; gap: 1px; font-size: 0.7rem; flex-wrap: wrap; }
    .puzzle-box {
      background: rgba(8,25,41,0.9); border-radius: 20px; padding: 12px 10px;
      border: 1px solid rgba(44,88,119,0.5); display: flex; flex-direction: column; gap: 8px;
    }
    .puzzle-subject {
      font-size: 0.7rem; color: #9ac7e7; background: rgba(0,183,255,0.15);
      padding: 3px 8px; border-radius: 10px; display: inline-block;
    }
    .puzzle-question {
      font-size: 0.9rem; font-weight: 600; background: rgba(11,31,50,0.8);
      padding: 10px; border-radius: 14px; color: #ceecff; border-left: 3px solid var(--cyan); line-height: 1.5;
    }
    .puzzle-question.flash-green { border-left-color: var(--green); background: rgba(0,255,136,0.1); }
    .puzzle-question.flash-red { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}
    }
    .game-input {
      background: #0f253b; border: 2px solid #2c5a7a; border-radius: 26px;
      padding: 12px 14px; font-size: 0.9rem; color: white; outline: none; width: 100%;
    }
    .game-input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,0.2); }
    .btn-row { display: flex; gap: 6px; }
    .hint-text { font-size: 0.7rem; color: #b8dff5; font-style: italic; min-height: 16px; }
    .message-text { font-weight: 600; text-align: center; min-height: 18px; font-size: 0.8rem; }
    .msg-good { color: var(--green); }
    .msg-bad { color: var(--red); }
    .nav-row { display: flex; gap: 6px; justify-content: center; align-items: center; }
    .nav-btn { flex: 0; min-width: 40px; padding: 8px 12px; font-size: 0.7rem; background: #1b3b52; }
    .footer-row { display: flex; gap: 6px; }

    /* ========== BADGE OVERLAY ========== */
    .badge-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center;
    }
    .badge-popup {
      background: linear-gradient(135deg, #0f2a3f, #1a3350); border-radius: 20px;
      padding: 24px; text-align: center; border: 3px solid var(--gold);
      animation: popIn 0.5s ease; max-width: 290px; width: 90%;
    }
    @keyframes popIn {
      0%{transform:scale(0.5);opacity:0} 70%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1}
    }
    .badge-icon-lg { font-size: 4rem; }
    .badge-title-lg { font-size: 1.3rem; font-weight: 700; color: var(--gold); margin: 8px 0; }
    .badge-desc-lg { font-size: 0.8rem; color: #ccc; margin-bottom: 12px; }

    /* Floating particles */
    .particles-box {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999;
    }
    .particle {
      position: absolute; font-size: 1.2rem; animation: floatUp 2s ease-out forwards; opacity: 0;
    }
    @keyframes floatUp {
      0%{transform:translateY(0) scale(0);opacity:1} 100%{transform:translateY(-120px) scale(1);opacity:0}
    }
    .score-pop {
      position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%);
      font-size: 2.5rem; font-weight: 800; pointer-events: none; z-index: 100;
      animation: popUp 1.5s ease forwards;
    }
    @keyframes popUp {
      0%{opacity:1;transform:translate(-50%,-50%) scale(0.5)} 50%{opacity:1;transform:translate(-50%,-80%) scale(1.3)}
      100%{opacity:0;transform:translate(-50%,-150%) scale(0.8)}
    }
  </style>
</head>
<body>

  <div class="particles-box" id="particlesBox"></div>
  <div class="score-pop" id="scorePop" style="display:none;"></div>

  <div class="game-wrapper" id="gameWrapper">
    <!-- ====== REGISTRATION ====== -->
    <div id="regScreen">
      <div class="reg-icon">🔐</div>
      <div class="reg-title">Escape Room Informatika</div>
      <div style="text-align:center;font-size:0.8rem;color:#8899aa;">🏆 3 Level • 30 Teka-teki • 25 Detik/Soal</div>
      <div class="reg-form">
        <label for="inpName">👤 Nama Lengkap</label>
        <input type="text" id="inpName" placeholder="Masukkan nama kamu..." autocomplete="off" enterkeyhint="next">
        <label for="inpClass">🏫 Kelas</label>
        <input type="text" id="inpClass" placeholder="Contoh: X RPL 1" autocomplete="off" enterkeyhint="done">
        <div class="error-msg" id="errorMsg"></div>
        <button class="btn btn-green" id="btnStart">🚀 MASUK LAB</button>
      </div>
    </div>

    <!-- ====== LEVEL SELECT ====== -->
    <div id="levelScreen">
      <div class="story-box" id="storyBox">📜 Selamat datang! Pilih level untuk memulai.</div>
      <div id="levelCards"></div>
      <div class="rank-box" id="rankBox">🏅 Ranking: 🔰 Pemula</div>
      <button class="btn btn-red" id="btnLogout">🚪 Ganti Peserta</button>
    </div>

    <!-- ====== GAME ====== -->
    <div id="gameScreen">
      <div class="game-header">
        <div class="player-tag">
          <span>👤 <b id="dName">-</b></span>
          <span>🏫 <span id="dClass">-</span></span>
          <span class="level-tag" id="dLevel">Level 1</span>
        </div>
        <span class="status-tag" id="dStatus">TERKUNCI</span>
      </div>
      <div class="timer-row" id="timerBox">
        <span>⏱️</span><span id="timerNum">25</span><span>detik</span>
      </div>
      <div class="timer-bar"><div class="timer-bar-fill" id="timerFill" style="width:100%;"></div></div>
      <div class="door-box">
        <div class="door locked" id="doorEl">🚪🔒</div>
      </div>
      <div class="progress-row">
        <span>🔑</span>
        <span class="key-icons" id="keyIcons"></span>
        <span id="counterLabel">0/10</span>
      </div>
      <div class="puzzle-box">
        <div>
          <span class="puzzle-subject" id="pSubject">-</span>
          <span style="float:right;font-size:0.7rem;color:#9ac7e7;" id="pNumber">Soal 1/10</span>
        </div>
        <div class="puzzle-question" id="pQuestion">🧩</div>
        <input type="text" class="game-input" id="inpAnswer" placeholder="Ketik jawaban..." autocomplete="off" enterkeyhint="done">
        <div class="btn-row">
          <button class="btn btn-blue" id="btnSubmit">🔍 Jawab</button>
          <button class="btn btn-blue" id="btnHint">💡 Hint</button>
        </div>
        <div class="hint-text" id="hintDisplay"></div>
        <div class="message-text" id="messageDisplay"></div>
        <div class="nav-row">
          <button class="btn btn-blue nav-btn" id="btnPrev">◀</button>
          <span id="pageIndicator" style="font-size:0.8rem;">1/10</span>
          <button class="btn btn-blue nav-btn" id="btnNext">▶</button>
        </div>
      </div>
      <div class="footer-row">
        <button class="btn btn-blue" id="btnBackLevel" style="flex:1;">📋 Pilih Level</button>
        <button class="btn btn-blue" id="btnReset" style="flex:1;">🔄 Ulangi</button>
      </div>
    </div>
  </div>

  <!-- ====== BADGE OVERLAY ====== -->
  <div class="badge-overlay" id="badgeOverlay">
    <div class="badge-popup">
      <div class="badge-icon-lg" id="badgeIcon">🏆</div>
      <div class="badge-title-lg" id="badgeTitle">Badge!</div>
      <div class="badge-desc-lg" id="badgeDesc">Deskripsi</div>
      <button class="btn btn-green" id="btnBadgeClose">✅ LANJUTKAN!</button>
    </div>
  </div>

  <script>
  (function(){
    // ========== DATA ==========
    const levelData = [
      {
        id:0, name:"Level 1: Dasar Informatika", icon:"🔰", short:"Level 1",
        story:"📜 Kamu terbangun di Lab Informatika dasar. Kuasai algoritma, biner, dan logika untuk membuka pintu pertama!",
        badge:{icon:"🥉",title:"Badge Perunggu",desc:"Kamu menguasai dasar informatika!"},
        puzzles:[
          {subject:"Algoritma",question:"➰ x=10, jika x>5 maka x=x*2, selain itu x=x-3. Nilai x akhir?",answer:"20",hints:["10>5 benar, 10×2","Jawaban: 20"]},
          {subject:"Bilangan Biner",question:"🔢 Konversi biner 1101 ke desimal.",answer:"13",hints:["8+4+0+1","13"]},
          {subject:"Logika",question:"🧠 Gerbang AND: A=1, B=0. Output? (0/1)",answer:"0",hints:["AND butuh semua 1","Karena ada 0, output 0"]},
          {subject:"Algoritma",question:"🔄 Perulangan selama kondisi benar? (while/for/if)",answer:"while",hints:["Dimulai w","5 huruf"]},
          {subject:"Bilangan Biner",question:"🔢 Desimal 8 dalam biner 4 bit?",answer:"1000",hints:["1×8+0×4+0×2+0×1","1000"]},
          {subject:"Logika",question:"🧠 Gerbang OR: A=0, B=0. Output?",answer:"0",hints:["OR butuh minimal satu 1","Semua 0, output 0"]},
          {subject:"Algoritma",question:"📊 Simbol flowchart untuk proses berbentuk?",answer:"persegi panjang",alt:["rectangle"],hints:["Bentuk kotak memanjang","Rectangle"]},
          {subject:"Bilangan Biner",question:"🔢 Biner 1111 ke desimal?",answer:"15",hints:["8+4+2+1","15"]},
          {subject:"Logika",question:"🧮 Gerbang NOT: input 1, output?",answer:"0",hints:["NOT membalik","1 jadi 0"]},
          {subject:"Algoritma",question:"🔍 Pencarian berurutan disebut?",answer:"sequential search",alt:["linear search"],hints:["Sequential Search","Linear Search"]}
        ]
      },
      {
        id:1, name:"Level 2: Hardware & Jaringan", icon:"⚙️", short:"Level 2",
        story:"📜 Hebat! Kamu masuk ruang server. Kuasai hardware dan jaringan untuk lanjut!",
        badge:{icon:"🥈",title:"Badge Perak",desc:"Kamu ahli hardware dan jaringan!"},
        puzzles:[
          {subject:"Hardware",question:"🖥️ CPU singkatan dari?",answer:"central processing unit",alt:["cpu"],hints:["Central Processing Unit","3 kata"]},
          {subject:"Jaringan",question:"🌐 LAN singkatan dari?",answer:"local area network",alt:["lan"],hints:["Local Area Network","Jaringan lokal"]},
          {subject:"Hardware",question:"💾 RAM singkatan dari?",answer:"random access memory",alt:["ram"],hints:["Random Access Memory","Memori akses acak"]},
          {subject:"Jaringan",question:"🌍 Jaringan seluruh dunia?",answer:"internet",hints:["Bukan LAN/WAN","7 huruf"]},
          {subject:"Hardware",question:"🖨️ Alat cetak dokumen?",answer:"printer",hints:["Dimulai P","7 huruf"]},
          {subject:"Jaringan",question:"📶 Pemancar sinyal WiFi?",answer:"access point",alt:["router"],hints:["Access Point","Router"]},
          {subject:"Hardware",question:"💻 Otak komputer disebut?",answer:"prosesor",alt:["processor","cpu"],hints:["Processor","CPU"]},
          {subject:"Jaringan",question:"🔒 WAN singkatan dari?",answer:"wide area network",alt:["wan"],hints:["Wide Area Network","Jaringan luas"]},
          {subject:"Hardware",question:"🖱️ Alat penunjuk di meja?",answer:"mouse",hints:["Dimulai M","5 huruf"]},
          {subject:"Jaringan",question:"📡 Kabel LAN umum disebut?",answer:"utp",alt:["lan","kabel lan"],hints:["UTP","Unshielded Twisted Pair"]}
        ]
      },
      {
        id:2, name:"Level 3: Pemrograman & Keamanan", icon:"💎", short:"Level 3",
        story:"📜 Level terakhir! Ruang server utama. Hanya master kode yang bisa keluar!",
        badge:{icon:"🥇",title:"Badge Emas",desc:"Kamu MASTER INFORMATIKA! Pintu terbuka!"},
        puzzles:[
          {subject:"Pemrograman",question:"💻 Python: perintah output?",answer:"print",hints:["Dimulai p","5 huruf"]},
          {subject:"Keamanan",question:"🔐 Ubah data jadi kode rahasia?",answer:"enkripsi",alt:["encryption"],hints:["Dimulai E","Lawannya dekripsi"]},
          {subject:"Web",question:"🌍 Bahasa markup web?",answer:"html",alt:["hypertext markup language"],hints:["H...","HyperText Markup Language"]},
          {subject:"Keamanan",question:"🔑 Kata sandi (Inggris)?",answer:"password",hints:["Dimulai P","8 huruf"]},
          {subject:"Pemrograman",question:"📦 Tipe data bilangan bulat?",answer:"integer",alt:["int"],hints:["int","integer"]},
          {subject:"Basis Data",question:"🗃️ DBMS singkatan?",answer:"database management system",alt:["dbms"],hints:["Database Management System","4 kata"]},
          {subject:"Pemrograman",question:"🔁 Perulangan jumlah pasti? (for/while)",answer:"for",hints:["Dimulai f","3 huruf"]},
          {subject:"Keamanan",question:"🦠 Program jahat menggandakan diri?",answer:"virus",alt:["worm"],hints:["Dimulai V","5 huruf"]},
          {subject:"Web",question:"🎨 Bahasa styling web?",answer:"css",hints:["Cascading Style Sheets","3 huruf"]},
          {subject:"Keamanan",question:"🛡️ Sistem keamanan jaringan?",answer:"firewall",hints:["Tembok api","Dimulai F"]}
        ]
      }
    ];

    const TIME_LIMIT = 25;

    // ========== STATE ==========
    let playerName = '', playerClass = '';
    let completedLevels = [false, false, false];
    let currentLevel = 0;
    let solved = [], failed = [];
    let puzzleIdx = 0;
    let timeLeft = TIME_LIMIT;
    let timerId = null;
    let msgId = null;

    // ========== DOM GETTERS ==========
    const $ = (id) => document.getElementById(id);
    const regScreen = $('regScreen');
    const levelScreen = $('levelScreen');
    const gameScreen = $('gameScreen');
    const badgeOverlay = $('badgeOverlay');
    const particlesBox = $('particlesBox');
    const scorePop = $('scorePop');

    // ========== SCREEN SWITCH ==========
    function showReg() {
      regScreen.style.display = 'flex';
      levelScreen.style.display = 'none';
      gameScreen.style.display = 'none';
      badgeOverlay.style.display = 'none';
    }
    function showLevel() {
      regScreen.style.display = 'none';
      levelScreen.style.display = 'flex';
      gameScreen.style.display = 'none';
      badgeOverlay.style.display = 'none';
      renderLevelCards();
      updateRank();
    }
    function showGame() {
      regScreen.style.display = 'none';
      levelScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
      badgeOverlay.style.display = 'none';
    }

    // ========== REGISTRATION ==========
    $('btnStart').addEventListener('click', function(){
      const n = $('inpName').value.trim();
      const k = $('inpClass').value.trim();
      $('errorMsg').textContent = '';
      if(!n){ $('errorMsg').textContent='⚠️ Nama harus diisi!'; $('inpName').focus(); return; }
      if(!k){ $('errorMsg').textContent='⚠️ Kelas harus diisi!'; $('inpClass').focus(); return; }
      if(n.length<3){ $('errorMsg').textContent='⚠️ Nama minimal 3 karakter!'; $('inpName').focus(); return; }
      playerName = n; playerClass = k;
      completedLevels = [false, false, false];
      $('dName').textContent = playerName;
      $('dClass').textContent = playerClass;
      $('inpName').value = ''; $('inpClass').value = '';
      $('storyBox').textContent = '📜 Selamat datang, '+playerName+'! Pilih level untuk memulai.';
      showLevel();
    });

    // Enter key support
    $('inpName').addEventListener('keypress', function(e){ if(e.key==='Enter'){ e.preventDefault(); $('inpClass').focus(); } });
    $('inpClass').addEventListener('keypress', function(e){ if(e.key==='Enter'){ e.preventDefault(); $('btnStart').click(); } });

    // ========== LEVEL SELECT ==========
    function renderLevelCards(){
      let html = '';
      levelData.forEach((lv, i)=>{
        let cls='locked', icon='🔒', desc='🔒 Selesaikan level sebelumnya';
        if(i===0 || completedLevels[i-1]){
          if(completedLevels[i]){ cls='completed'; icon='✅'; desc='✅ Level selesai!'; }
          else { cls='unlocked'; icon=lv.icon; desc='10 Soal • 25 Detik/Soal'; }
        }
        html += '<div class="level-card '+cls+'" data-level="'+i+'" id="cardLevel'+i+'">'+
          '<div class="level-info"><span class="level-name">'+lv.name+'</span><span class="level-desc">'+desc+'</span></div>'+
          '<div class="level-icon">'+icon+'</div></div>';
      });
      $('levelCards').innerHTML = html;

      // Attach click events langsung
      levelData.forEach((lv, i)=>{
        const card = document.getElementById('cardLevel'+i);
        if(card){
          card.onclick = function(){
            if(i>0 && !completedLevels[i-1]){
              $('storyBox').textContent = '🔒 Level terkunci! Selesaikan level sebelumnya.';
              return;
            }
            startLevel(i);
          };
        }
      });
    }

    function updateRank(){
      const total = completedLevels.filter(v=>v).length;
      let rank = '🔰 Pemula';
      if(total===1) rank='🥉 Perunggu';
      if(total===2) rank='🥈 Perak';
      if(total===3) rank='🥇 Master Informatika';
      $('rankBox').textContent = '🏅 Ranking: '+rank;
    }

    $('btnLogout').addEventListener('click', function(){
      stopTimer();
      completedLevels=[false,false,false];
      playerName=''; playerClass='';
      showReg();
      $('inpName').focus();
    });

    // ========== START LEVEL ==========
    function startLevel(index){
      currentLevel = index;
      const lv = levelData[index];
      solved = new Array(lv.puzzles.length).fill(false);
      failed = new Array(lv.puzzles.length).fill(false);
      puzzleIdx = 0;
      $('dLevel').textContent = lv.short;
      stopTimer();
      if(msgId) clearTimeout(msgId);
      $('messageDisplay').textContent = '';
      $('hintDisplay').textContent = '';
      $('timerBox').classList.remove('timer-warning');
      $('timerFill').style.width = '100%';
      updateGameUI();
      showGame();
      setTimeout(function(){ $('inpAnswer').focus(); }, 200);
    }

    // ========== TIMER ==========
    function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
    function startTimer(){
      stopTimer();
      if(solved[puzzleIdx] || failed[puzzleIdx] || solved.every(v=>v)){
        $('timerNum').textContent = '--';
        $('timerFill').style.width = '0%';
        return;
      }
      timeLeft = TIME_LIMIT;
      $('timerNum').textContent = timeLeft;
      $('timerFill').style.width = '100%';
      $('timerBox').classList.remove('timer-warning');
      timerId = setInterval(function(){
        timeLeft--;
        $('timerNum').textContent = timeLeft;
        $('timerFill').style.width = ((timeLeft/TIME_LIMIT)*100)+'%';
        if(timeLeft<=5) $('timerBox').classList.add('timer-warning');
        if(timeLeft<=0){ stopTimer(); handleTimeout(); }
      }, 1000);
    }

    function handleTimeout(){
      if(solved[puzzleIdx] || failed[puzzleIdx]) return;
      failed[puzzleIdx] = true;
      showMsg('⏰ Waktu habis! Soal gagal. 😞', false);
      if(navigator.vibrate) navigator.vibrate([100,50,100]);
      updateGameUI();
    }

    // ========== GAME UI ==========
    function updateGameUI(){
      const lv = levelData[currentLevel];
      const puzzles = lv.puzzles;
      const total = puzzles.length;
      const done = solved.filter(v=>v).length;

      let icons = '';
      for(let i=0; i<total; i++){
        if(solved[i]) icons+='🔑';
        else if(failed[i]) icons+='❌';
        else icons+='⚪';
      }
      $('keyIcons').textContent = icons;
      $('counterLabel').textContent = done+'/'+total;

      const door = $('doorEl');
      const status = $('dStatus');
      if(done===total){
        door.classList.remove('locked'); door.classList.add('unlocked');
        door.textContent='🚪✨'; status.textContent='TERBUKA'; status.style.background='#00c853';
        stopTimer(); $('timerNum').textContent='✓'; $('timerFill').style.width='100%';
        $('timerFill').style.background='var(--green)';
        if(!completedLevels[currentLevel]){
          completedLevels[currentLevel]=true;
          updateRank();
          spawnParticles('🎉', 20);
          showBadge(lv.badge);
        }
      } else {
        door.classList.add('locked'); door.classList.remove('unlocked');
        door.textContent='🚪🔒'; status.textContent='TERKUNCI'; status.style.background='#00c8ff';
        $('timerFill').style.background='linear-gradient(90deg, var(--green), var(--gold), var(--red))';
      }

      const p = puzzles[puzzleIdx];
      $('pSubject').textContent = p.subject;
      $('pNumber').textContent = 'Soal '+(puzzleIdx+1)+'/'+total;
      $('pQuestion').textContent = p.question;
      $('pageIndicator').textContent = (puzzleIdx+1)+'/'+total;

      const inp = $('inpAnswer');
      const sBtn = $('btnSubmit');
      const hBtn = $('btnHint');
      const hDisp = $('hintDisplay');
      const qDisp = $('pQuestion');

      qDisp.classList.remove('flash-green','flash-red');

      if(solved[puzzleIdx]){
        inp.disabled=true; sBtn.disabled=true; hBtn.disabled=false;
        inp.value=p.answer; hDisp.textContent='✅ Sudah benar!';
      } else if(failed[puzzleIdx]){
        inp.disabled=true; sBtn.disabled=true; hBtn.disabled=true;
        inp.value=''; inp.placeholder='Waktu habis'; hDisp.textContent='❌ Gagal.';
      } else if(done===total){
        inp.disabled=true; sBtn.disabled=true; hBtn.disabled=true;
        hDisp.textContent='🎉 Level selesai!';
      } else {
        inp.disabled=false; sBtn.disabled=false; hBtn.disabled=false;
        inp.value=''; inp.placeholder='Ketik jawaban...'; hDisp.textContent='';
      }

      if(!solved.every(v=>v) && !solved[puzzleIdx] && !failed[puzzleIdx]) startTimer();
      else { stopTimer(); if(solved.every(v=>v)){ $('timerNum').textContent='✓'; $('timerFill').style.width='100%'; } }
    }

    function checkAns(ans, p){
      const n = ans.trim().toLowerCase();
      if(!n) return false;
      if(n===p.answer.toLowerCase()) return true;
      if(p.alt) return p.alt.some(a=>n===a.toLowerCase());
      return false;
    }

    function showMsg(text, good){
      if(msgId) clearTimeout(msgId);
      const m = $('messageDisplay');
      m.textContent = text;
      m.className = 'message-text '+(good?'msg-good':'msg-bad');
      msgId = setTimeout(function(){ m.textContent=''; m.className='message-text'; }, 2500);
    }

    function spawnParticles(emoji, count){
      for(let i=0; i<count; i++){
        const p = document.createElement('span');
        p.className='particle';
        p.textContent=emoji;
        p.style.left=Math.random()*100+'%';
        p.style.top=(50+Math.random()*30)+'%';
        p.style.animationDuration=(1+Math.random()*2)+'s';
        particlesBox.appendChild(p);
        setTimeout(function(){ p.remove(); }, 2500);
      }
    }

    function showScorePop(text, color){
      scorePop.textContent=text;
      scorePop.style.color=color||'var(--green)';
      scorePop.style.display='block';
      scorePop.style.animation='none';
      scorePop.offsetHeight;
      scorePop.style.animation='popUp 1.5s ease forwards';
      setTimeout(function(){ scorePop.style.display='none'; }, 1500);
    }

    // ========== GAME ACTIONS ==========
    $('btnSubmit').addEventListener('click', function(){
      if(solved.every(v=>v)) return;
      if(solved[puzzleIdx] || failed[puzzleIdx]){ showMsg('Soal tidak bisa dijawab lagi.', false); return; }
      const ans = $('inpAnswer').value.trim();
      if(!ans){ showMsg('⚠️ Masukkan jawaban dulu!', false); if(navigator.vibrate) navigator.vibrate(50); return; }
      const p = levelData[currentLevel].puzzles[puzzleIdx];
      if(checkAns(ans, p)){
        stopTimer();
        solved[puzzleIdx]=true;
        const speed = TIME_LIMIT - timeLeft;
        const bonus = Math.max(0, Math.floor((TIME_LIMIT-speed)/5));
        $('pQuestion').classList.add('flash-green');
        showMsg('✅ Benar! +'+(10+bonus)+' poin ⚡', true);
        showScorePop('+'+(10+bonus));
        spawnParticles('✨', 10);
        if(navigator.vibrate) navigator.vibrate(50);
        updateGameUI();
        if(solved.every(v=>v)){
          showMsg('🎉 SELAMAT! Level selesai! 🌟', true);
          spawnParticles('🌟', 20);
        }
      } else {
        $('pQuestion').classList.add('flash-red');
        showMsg('❌ Jawaban salah. Coba lagi!', false);
        if(navigator.vibrate) navigator.vibrate([80,50,80]);
        $('inpAnswer').value='';
        $('inpAnswer').focus();
      }
    });

    $('btnHint').addEventListener('click', function(){
      if(solved.every(v=>v)) return;
      if(failed[puzzleIdx]) return;
      const hints = levelData[currentLevel].puzzles[puzzleIdx].hints;
      if(hints && hints.length) $('hintDisplay').textContent = '💬 Hint: '+hints[Math.floor(Math.random()*hints.length)];
    });

    $('btnPrev').addEventListener('click', function(){
      if(puzzleIdx>0){ stopTimer(); puzzleIdx--; updateGameUI(); }
    });
    $('btnNext').addEventListener('click', function(){
      if(puzzleIdx < levelData[currentLevel].puzzles.length-1){ stopTimer(); puzzleIdx++; updateGameUI(); }
    });

    $('btnReset').addEventListener('click', function(){
      stopTimer();
      const total = levelData[currentLevel].puzzles.length;
      solved=new Array(total).fill(false); failed=new Array(total).fill(false);
      puzzleIdx=0;
      if(msgId) clearTimeout(msgId);
      $('messageDisplay').textContent=''; $('hintDisplay').textContent='';
      $('timerBox').classList.remove('timer-warning');
      $('timerFill').style.width='100%';
      updateGameUI();
      $('inpAnswer').focus();
      showMsg('🔄 Level diulang. Semangat! 💪', true);
    });

    $('btnBackLevel').addEventListener('click', function(){
      stopTimer();
      if(msgId) clearTimeout(msgId);
      $('messageDisplay').textContent='';
      updateRank();
      renderLevelCards();
      showLevel();
    });

    $('inpAnswer').addEventListener('keypress', function(e){
      if(e.key==='Enter'){ e.preventDefault(); $('btnSubmit').click(); }
    });

    // ========== BADGE ==========
    function showBadge(badge){
      $('badgeIcon').textContent=badge.icon;
      $('badgeTitle').textContent=badge.title;
      $('badgeDesc').textContent=badge.desc;
      badgeOverlay.style.display='flex';
    }
    $('btnBadgeClose').addEventListener('click', function(){
      badgeOverlay.style.display='none';
      updateRank();
      renderLevelCards();
      showLevel();
    });

    // ========== INIT ==========
    showReg();
    $('inpName').focus();
    document.addEventListener('touchstart', function(){}, {passive:true});
  })();
  </script>
</body>
</html>
